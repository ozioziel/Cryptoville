# Compila los contratos escrow (v1 y v2) en GitHub y publica un Release verificable de cada uno (SEP-55).
# GitHub firma una attestation que une el hash del .wasm con este repo y este commit, y el .wasm lleva
# `source_repo=github:ozioziel/Cryptoville` en sus metadatos. Con eso StellarExpert marca el contrato como verificado.
#
# Uso: desde main, publica un tag que empiece con «contratos-», por ejemplo:
#   git tag contratos-1 && git push origin contratos-1
# Luego usa el .wasm de cada Release (no el de contracts/dist): ver docs/guia-stellar-lab.md, «Contratos verificados».
name: Release de los contratos

on:
  push:
    tags: ['contratos-*']

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  escrow-v1:
    # Fijado a un commit (usa Stellar CLI 28.1.0, compatible con soroban-sdk 28) para que nadie cambie lo que compila.
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@6b16426dd3a61715ddddf83a2df322a6371fe071
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Contrato escrow v1 de Cryptoville (pago con garantía). Compilado por GitHub Actions desde este commit.'
      relative_path: 'contracts'
      package: 'cryptoville-escrow'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  escrow-v2:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@6b16426dd3a61715ddddf83a2df322a6371fe071
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Contrato escrow v2 de Cryptoville (pagos por etapas, pago directo y disputas por fase). Compilado por GitHub Actions desde este commit.'
      relative_path: 'contracts'
      package: 'cryptoville-escrow-v2'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
